<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-labelledby="t d"><title id="t">Audit evidence chain</title><desc id="d">Five steps an auditor follows: control, existence, valuation, treatment and disclosure.</desc><rect width="760" height="340" fill="#fcf9f0"/><text x="30" y="38" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#172b4d" text-anchor="start">What an auditor can follow</text><text x="30" y="58" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#43536b" text-anchor="start">From wallet to financial statements</text><line x1="30" y1="70" x2="730" y2="70" stroke="#b18d54" stroke-width="2"/><rect x="30" y="110" width="128" height="100" rx="4" fill="#efe8d8" stroke="#d7cfbd"/><text x="94.0" y="147.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#b18d54" text-anchor="middle">1  Control</text><text x="94.0" y="165.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="middle">Proof you can</text><text x="94.0" y="183.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="middle">sign for the keys</text><line x1="158" y1="160" x2="172" y2="160" stroke="#43536b" stroke-width="1.6"/><polygon points="172,160 164,156 164,164" fill="#43536b"/><rect x="172" y="110" width="128" height="100" rx="4" fill="#efe8d8" stroke="#d7cfbd"/><text x="236.0" y="147.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#b18d54" text-anchor="middle">2  Existence</text><text x="236.0" y="165.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="middle">Balance visible</text><text x="236.0" y="183.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="middle">on the public ledger</text><line x1="300" y1="160" x2="314" y2="160" stroke="#43536b" stroke-width="1.6"/><polygon points="314,160 306,156 306,164" fill="#43536b"/><rect x="314" y="110" width="128" height="100" rx="4" fill="#efe8d8" stroke="#d7cfbd"/><text x="378.0" y="147.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#b18d54" text-anchor="middle">3  Valuation</text><text x="378.0" y="165.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="middle">Price source</text><text x="378.0" y="183.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="middle">and date</text><line x1="442" y1="160" x2="456" y2="160" stroke="#43536b" stroke-width="1.6"/><polygon points="456,160 448,156 448,164" fill="#43536b"/><rect x="456" y="110" width="128" height="100" rx="4" fill="#efe8d8" stroke="#d7cfbd"/><text x="520.0" y="147.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#b18d54" text-anchor="middle">4  Treatment</text><text x="520.0" y="165.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="middle">Accounting standard</text><text x="520.0" y="183.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="middle">applied</text><line x1="584" y1="160" x2="598" y2="160" stroke="#43536b" stroke-width="1.6"/><polygon points="598,160 590,156 590,164" fill="#43536b"/><rect x="598" y="110" width="128" height="100" rx="4" fill="#efe8d8" stroke="#d7cfbd"/><text x="662.0" y="147.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#b18d54" text-anchor="middle">5  Disclosure</text><text x="662.0" y="165.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="middle">Notes, risks,</text><text x="662.0" y="183.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="middle">restrictions</text><rect x="30" y="236" width="700" height="50" rx="4" fill="#fff" stroke="#b18d54"/><text x="380.0" y="266.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#172b4d" text-anchor="middle">Evidence you prepare before the audit: wallet list, signed message, ledger records, custody agreement</text></svg>