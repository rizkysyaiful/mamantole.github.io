<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d"><title id="t">Accounting treatment starting points</title><desc id="d">A decision from why the company holds Bitcoin to inventory under IAS 2 or intangible asset under IAS 38, with US GAAP fair value shown separately.</desc><rect width="760" height="330" fill="#fcf9f0"/><text x="30" y="38" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#172b4d" text-anchor="start">How the accounting question usually starts</text><text x="30" y="58" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#43536b" text-anchor="start">Reference points, not a conclusion. Your auditor decides.</text><line x1="30" y1="70" x2="730" y2="70" stroke="#b18d54" stroke-width="2"/><rect x="260" y="86" width="240" height="50" rx="4" fill="#172b4d" stroke="#d7cfbd"/><text x="380.0" y="116.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f8f4e8" text-anchor="middle">Why does the company hold it?</text><line x1="300" y1="136" x2="170" y2="172" stroke="#43536b" stroke-width="1.6"/><polygon points="170,172 166,164 174,164" fill="#43536b"/><line x1="460" y1="136" x2="590" y2="172" stroke="#43536b" stroke-width="1.6"/><polygon points="590,172 586,164 594,164" fill="#43536b"/><rect x="40" y="172" width="260" height="76" rx="4" fill="#efe8d8" stroke="#d7cfbd"/><text x="170.0" y="197.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#b18d54" text-anchor="middle">Inventory (IAS 2)</text><text x="170.0" y="215.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="middle">Held for sale in the ordinary</text><text x="170.0" y="233.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="middle">course of business</text><rect x="460" y="172" width="260" height="76" rx="4" fill="#efe8d8" stroke="#d7cfbd"/><text x="590.0" y="197.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#b18d54" text-anchor="middle">Intangible (IAS 38)</text><text x="590.0" y="215.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="middle">Held as a long-term</text><text x="590.0" y="233.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="middle">treasury asset</text><rect x="40" y="262" width="680" height="48" rx="4" fill="#fff" stroke="#b18d54"/><text x="380.0" y="291.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#172b4d" text-anchor="middle">US GAAP is different: fair value measurement for crypto assets under FASB ASU 2023-08</text></svg>