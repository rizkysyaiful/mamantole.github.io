<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-labelledby="t d"><title id="t">Regulatory checklist</title><desc id="d">Six questions to take to a qualified lawyer about holding Bitcoin as a company.</desc><rect width="760" height="340" fill="#fcf9f0"/><text x="30" y="38" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#172b4d" text-anchor="start">Turn "yes or no" into a checklist for your lawyer</text><text x="30" y="58" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#43536b" text-anchor="start">Rules differ by country and change. The checklist stays useful.</text><line x1="30" y1="70" x2="730" y2="70" stroke="#b18d54" stroke-width="2"/><rect x="30" y="92" width="345" height="56" rx="4" fill="#fff" stroke="#d7cfbd"/><circle cx="54" cy="120" r="12" fill="#172b4d"/><text x="54" y="125" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#f8f4e8" text-anchor="middle">1</text><text x="76" y="124" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#172b4d" text-anchor="start">Who supervises crypto-assets where we operate?</text><rect x="385" y="92" width="345" height="56" rx="4" fill="#fff" stroke="#d7cfbd"/><circle cx="409" cy="120" r="12" fill="#172b4d"/><text x="409" y="125" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#f8f4e8" text-anchor="middle">2</text><text x="431" y="117" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#172b4d" text-anchor="start">May a company hold the asset</text><text x="431" y="134" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#172b4d" text-anchor="start">on its balance sheet?</text><rect x="30" y="160" width="345" height="56" rx="4" fill="#fff" stroke="#d7cfbd"/><circle cx="54" cy="188" r="12" fill="#172b4d"/><text x="54" y="193" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#f8f4e8" text-anchor="middle">3</text><text x="76" y="185" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#172b4d" text-anchor="start">Holding is one question. Paying with</text><text x="76" y="202" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#172b4d" text-anchor="start">it is another.</text><rect x="385" y="160" width="345" height="56" rx="4" fill="#fff" stroke="#d7cfbd"/><circle cx="409" cy="188" r="12" fill="#172b4d"/><text x="409" y="193" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#f8f4e8" text-anchor="middle">4</text><text x="431" y="185" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#172b4d" text-anchor="start">Which licensed venues and custodians may</text><text x="431" y="202" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#172b4d" text-anchor="start">we use?</text><rect x="30" y="228" width="345" height="56" rx="4" fill="#fff" stroke="#d7cfbd"/><circle cx="54" cy="256" r="12" fill="#172b4d"/><text x="54" y="261" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#f8f4e8" text-anchor="middle">5</text><text x="76" y="253" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#172b4d" text-anchor="start">What must we report, to whom,</text><text x="76" y="270" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#172b4d" text-anchor="start">and how often?</text><rect x="385" y="228" width="345" height="56" rx="4" fill="#fff" stroke="#d7cfbd"/><circle cx="409" cy="256" r="12" fill="#172b4d"/><text x="409" y="261" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#f8f4e8" text-anchor="middle">6</text><text x="431" y="253" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#172b4d" text-anchor="start">What does our tax adviser say</text><text x="431" y="270" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#172b4d" text-anchor="start">about each step?</text><text x="30" y="322" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#43536b" text-anchor="start">Not legal advice. Your counsel gives the answers.</text></svg>