<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-labelledby="t d"><title id="t">Price question versus structure question</title><desc id="d">Two panels contrasting asking whether the price is too high with asking what kind of asset Bitcoin is.</desc><rect width="760" height="340" fill="#fcf9f0"/><text x="30" y="38" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#172b4d" text-anchor="start">Two different questions</text><text x="30" y="58" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#43536b" text-anchor="start">Price answers one. Structure answers the other.</text><line x1="30" y1="70" x2="730" y2="70" stroke="#b18d54" stroke-width="2"/><rect x="30" y="92" width="325" height="190" rx="4" fill="#efe8d8" stroke="#d7cfbd"/><text x="48" y="120" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#172b4d" text-anchor="start">"Is the price too high?"</text><text x="48" y="148" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#43536b" text-anchor="start">A question about today.</text><text x="48" y="166" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#43536b" text-anchor="start">Moves with sentiment and news.</text><text x="48" y="184" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#43536b" text-anchor="start">Can be right or wrong in a month.</text><text x="48" y="202" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#43536b" text-anchor="start">Cannot be settled by an argument.</text><rect x="405" y="92" width="325" height="190" rx="4" fill="#fff" stroke="#b18d54"/><text x="423" y="120" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#172b4d" text-anchor="start">"What kind of asset is this?"</text><text x="423" y="148" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#43536b" text-anchor="start">Supply schedule: set in the protocol.</text><text x="423" y="166" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#43536b" text-anchor="start">Adoption: who holds it, who accepts it.</text><text x="423" y="184" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#43536b" text-anchor="start">Your own need: what risk does it cover?</text><text x="423" y="202" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#43536b" text-anchor="start">A policy can answer all three.</text><line x1="355" y1="187" x2="405" y2="187" stroke="#b18d54" stroke-width="1.6"/><polygon points="405,187 397,183 397,191" fill="#b18d54"/><text x="30" y="322" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#43536b" text-anchor="start">Bubbles are about price running ahead of value. A treasury decision is about size, horizon and purpose.</text></svg>