<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-labelledby="t d"><title id="t">Board questions mapped to one policy</title><desc id="d">Five board questions, each pointing down to a single written treasury policy.</desc><rect width="760" height="340" fill="#fcf9f0"/><text x="30" y="38" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#172b4d" text-anchor="start">What a board asks, and where the answer lives</text><text x="30" y="58" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#43536b" text-anchor="start">The board approves clear policy, not enthusiasm.</text><line x1="30" y1="70" x2="730" y2="70" stroke="#b18d54" stroke-width="2"/><rect x="30" y="100" width="128" height="92" rx="4" fill="#efe8d8" stroke="#d7cfbd"/><text x="94.0" y="133.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#b18d54" text-anchor="middle">Why?</text><text x="94.0" y="151.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="middle">Purpose and</text><text x="94.0" y="169.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="middle">the risk it covers</text><line x1="94" y1="192" x2="94" y2="226" stroke="#43536b" stroke-width="1.6"/><polygon points="94,226 90,218 98,218" fill="#43536b"/><rect x="172" y="100" width="128" height="92" rx="4" fill="#efe8d8" stroke="#d7cfbd"/><text x="236.0" y="133.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#b18d54" text-anchor="middle">How much?</text><text x="236.0" y="151.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="middle">Allocation cap</text><text x="236.0" y="169.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="middle">as % of reserves</text><line x1="236" y1="192" x2="236" y2="226" stroke="#43536b" stroke-width="1.6"/><polygon points="236,226 232,218 240,218" fill="#43536b"/><rect x="314" y="100" width="128" height="92" rx="4" fill="#efe8d8" stroke="#d7cfbd"/><text x="378.0" y="133.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#b18d54" text-anchor="middle">Where kept?</text><text x="378.0" y="151.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="middle">Custody model</text><text x="378.0" y="169.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="middle">and controls</text><line x1="378" y1="192" x2="378" y2="226" stroke="#43536b" stroke-width="1.6"/><polygon points="378,226 374,218 382,218" fill="#43536b"/><rect x="456" y="100" width="128" height="92" rx="4" fill="#efe8d8" stroke="#d7cfbd"/><text x="520.0" y="133.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#b18d54" text-anchor="middle">Who decides?</text><text x="520.0" y="151.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="middle">Approvals and</text><text x="520.0" y="169.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="middle">authority limits</text><line x1="520" y1="192" x2="520" y2="226" stroke="#43536b" stroke-width="1.6"/><polygon points="520,226 516,218 524,218" fill="#43536b"/><rect x="598" y="100" width="128" height="92" rx="4" fill="#efe8d8" stroke="#d7cfbd"/><text x="662.0" y="133.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#b18d54" text-anchor="middle">How reported?</text><text x="662.0" y="151.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="middle">Accounting and</text><text x="662.0" y="169.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="middle">board reporting</text><line x1="662" y1="192" x2="662" y2="226" stroke="#43536b" stroke-width="1.6"/><polygon points="662,226 658,218 666,218" fill="#43536b"/><rect x="30" y="228" width="700" height="56" rx="4" fill="#172b4d" stroke="#d7cfbd"/><text x="380.0" y="261.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f8f4e8" text-anchor="middle">One written treasury policy the board can read, amend and sign</text><text x="30" y="322" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#43536b" text-anchor="start">If every question has a written answer, the decision becomes ordinary governance.</text></svg>