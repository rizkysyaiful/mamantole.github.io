<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-labelledby="t d"><title id="t">Position size decides the impact</title><desc id="d">Two panels showing that a 50 percent fall costs about 1 percent of reserves at a 2 percent holding and 10 percent at a 20 percent holding.</desc><rect width="760" height="340" fill="#fcf9f0"/><text x="30" y="38" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#172b4d" text-anchor="start">Same price fall, different size of problem</text><text x="30" y="58" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#43536b" text-anchor="start">A 50% fall in the asset, applied to two position sizes. Illustrative.</text><line x1="30" y1="70" x2="730" y2="70" stroke="#b18d54" stroke-width="2"/><rect x="70" y="100" width="260" height="150" rx="4" fill="#fff" stroke="#d7cfbd"/><rect x="70" y="100" width="13.0" height="150" fill="#b18d54" opacity=".45"/><text x="200" y="278" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#172b4d" text-anchor="middle">Holding = 2% of reserves</text><text x="200" y="298" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#43536b" text-anchor="middle">Reserves fall by about 1%</text><rect x="420" y="100" width="260" height="150" rx="4" fill="#fff" stroke="#d7cfbd"/><rect x="420" y="100" width="130.0" height="150" fill="#b18d54" opacity=".45"/><text x="550" y="278" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#172b4d" text-anchor="middle">Holding = 20% of reserves</text><text x="550" y="298" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#43536b" text-anchor="middle">Reserves fall by about 10%</text><text x="70" y="92" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#43536b" text-anchor="start">Shaded part is the share of total reserves lost (scaled x5)</text></svg>