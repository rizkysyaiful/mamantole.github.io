<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 334" width="760" height="334" role="img" aria-labelledby="t d"><title id="t">One-page policy outline</title><desc id="d">Seven sections of a one-page Bitcoin treasury policy: purpose, allocation, buying method, custody, authority, reporting and review.</desc><rect width="760" height="334" fill="#fcf9f0"/><text x="30" y="38" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#172b4d" text-anchor="start">A one-page treasury policy</text><text x="30" y="58" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#43536b" text-anchor="start">Seven sections the board can read in five minutes</text><line x1="30" y1="70" x2="730" y2="70" stroke="#b18d54" stroke-width="2"/><rect x="30" y="84" width="700" height="30" fill="#efe8d8"/><text x="44" y="104" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#172b4d" text-anchor="start">1  Purpose: what risk this covers</text><rect x="30" y="118" width="700" height="30" fill="#fcf9f0"/><text x="44" y="138" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="start">2  Allocation: cap as % of reserves, not for operating cash</text><rect x="30" y="152" width="700" height="30" fill="#efe8d8"/><text x="44" y="172" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="start">3  Buying method: schedule, venues, limits</text><rect x="30" y="186" width="700" height="30" fill="#fcf9f0"/><text x="44" y="206" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="start">4  Custody: model, signers, backups, recovery</text><rect x="30" y="220" width="700" height="30" fill="#efe8d8"/><text x="44" y="240" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="start">5  Authority: who proposes, approves, executes</text><rect x="30" y="254" width="700" height="30" fill="#fcf9f0"/><text x="44" y="274" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="start">6  Reporting: accounting treatment, board cadence</text><rect x="30" y="288" width="700" height="30" fill="#efe8d8"/><text x="44" y="308" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="start">7  Review: triggers to pause, reduce or exit</text></svg>