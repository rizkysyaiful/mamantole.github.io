<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-labelledby="t d"><title id="t">Three layers of Bitcoin risk</title><desc id="d">Layers: the network, exchanges and wallet software, and people and process, with the risk type at each layer.</desc><rect width="760" height="340" fill="#fcf9f0"/><text x="30" y="38" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#172b4d" text-anchor="start">Where Bitcoin losses actually happen</text><text x="30" y="58" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#43536b" text-anchor="start">Three layers, three different kinds of risk</text><line x1="30" y1="70" x2="730" y2="70" stroke="#b18d54" stroke-width="2"/><rect x="30" y="92" width="700" height="66" rx="4" fill="#efe8d8" stroke="#d7cfbd"/><text x="48" y="119" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#172b4d" text-anchor="start">The network</text><text x="48" y="140" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#43536b" text-anchor="start">Consensus rules and the ledger</text><text x="712" y="130" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#172b4d" text-anchor="end">Not the layer where the headline losses sit</text><rect x="30" y="168" width="700" height="66" rx="4" fill="#fff" stroke="#b18d54"/><text x="48" y="195" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#172b4d" text-anchor="start">Exchanges and wallet software</text><text x="48" y="216" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#43536b" text-anchor="start">Platforms, apps, devices</text><text x="712" y="206" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#172b4d" text-anchor="end">Failures, tampering and bad design</text><rect x="30" y="244" width="700" height="66" rx="4" fill="#efe8d8" stroke="#b18d54"/><text x="48" y="271" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#172b4d" text-anchor="start">People and process</text><text x="48" y="292" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#43536b" text-anchor="start">Who holds keys, who approves</text><text x="712" y="282" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#172b4d" text-anchor="end">Phishing, lost keys, no controls</text></svg>