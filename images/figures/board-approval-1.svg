<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-labelledby="t d"><title id="t">Board approval stages</title><desc id="d">Five stages: brief, educate, draft, pre-read and decide, ending with a scheduled review date.</desc><rect width="760" height="340" fill="#fcf9f0"/><text x="30" y="38" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#172b4d" text-anchor="start">From first conversation to board resolution</text><text x="30" y="58" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#43536b" text-anchor="start">Five stages. Each ends with something written.</text><line x1="30" y1="70" x2="730" y2="70" stroke="#b18d54" stroke-width="2"/><rect x="30" y="110" width="128" height="100" rx="4" fill="#efe8d8" stroke="#d7cfbd"/><text x="94.0" y="147.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#b18d54" text-anchor="middle">Brief</text><text x="94.0" y="165.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="middle">One-page</text><text x="94.0" y="183.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="middle">problem statement</text><line x1="158" y1="160" x2="172" y2="160" stroke="#43536b" stroke-width="1.6"/><polygon points="172,160 164,156 164,164" fill="#43536b"/><rect x="172" y="110" width="128" height="100" rx="4" fill="#efe8d8" stroke="#d7cfbd"/><text x="236.0" y="147.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#b18d54" text-anchor="middle">Educate</text><text x="236.0" y="165.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="middle">Leadership</text><text x="236.0" y="183.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="middle">session</text><line x1="300" y1="160" x2="314" y2="160" stroke="#43536b" stroke-width="1.6"/><polygon points="314,160 306,156 306,164" fill="#43536b"/><rect x="314" y="110" width="128" height="100" rx="4" fill="#efe8d8" stroke="#d7cfbd"/><text x="378.0" y="147.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#b18d54" text-anchor="middle">Draft</text><text x="378.0" y="165.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="middle">Policy and</text><text x="378.0" y="183.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="middle">decision paper</text><line x1="442" y1="160" x2="456" y2="160" stroke="#43536b" stroke-width="1.6"/><polygon points="456,160 448,156 448,164" fill="#43536b"/><rect x="456" y="110" width="128" height="100" rx="4" fill="#efe8d8" stroke="#d7cfbd"/><text x="520.0" y="147.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#b18d54" text-anchor="middle">Pre-read</text><text x="520.0" y="165.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="middle">Questions and</text><text x="520.0" y="183.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="middle">risks answered</text><line x1="584" y1="160" x2="598" y2="160" stroke="#43536b" stroke-width="1.6"/><polygon points="598,160 590,156 590,164" fill="#43536b"/><rect x="598" y="110" width="128" height="100" rx="4" fill="#efe8d8" stroke="#d7cfbd"/><text x="662.0" y="147.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#b18d54" text-anchor="middle">Decide</text><text x="662.0" y="165.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="middle">Resolution</text><text x="662.0" y="183.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="middle">with limits</text><rect x="30" y="236" width="700" height="50" rx="4" fill="#fff" stroke="#b18d54"/><text x="380.0" y="266.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#172b4d" text-anchor="middle">After approval: a first review date is set before anything is bought</text></svg>