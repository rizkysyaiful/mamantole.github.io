<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-labelledby="t d"><title id="t">From electricity to security</title><desc id="d">Four steps from electricity to hashing work to cost of attack to a ledger anyone can verify.</desc><rect width="760" height="340" fill="#fcf9f0"/><text x="30" y="38" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#172b4d" text-anchor="start">What the electricity is doing</text><text x="30" y="58" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#43536b" text-anchor="start">Mining converts electricity into a cost that protects the ledger</text><line x1="30" y1="70" x2="730" y2="70" stroke="#b18d54" stroke-width="2"/><rect x="30" y="110" width="160" height="100" rx="4" fill="#efe8d8" stroke="#d7cfbd"/><text x="110.0" y="147.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#b18d54" text-anchor="middle">Electricity</text><text x="110.0" y="165.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="middle">Bought from</text><text x="110.0" y="183.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="middle">the grid or a site</text><line x1="190" y1="160" x2="212" y2="160" stroke="#43536b" stroke-width="1.6"/><polygon points="212,160 204,156 204,164" fill="#43536b"/><rect x="212" y="110" width="160" height="100" rx="4" fill="#efe8d8" stroke="#d7cfbd"/><text x="292.0" y="147.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#b18d54" text-anchor="middle">Hashing work</text><text x="292.0" y="165.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="middle">Machines try</text><text x="292.0" y="183.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="middle">to win a block</text><line x1="372" y1="160" x2="394" y2="160" stroke="#43536b" stroke-width="1.6"/><polygon points="394,160 386,156 386,164" fill="#43536b"/><rect x="394" y="110" width="160" height="100" rx="4" fill="#efe8d8" stroke="#d7cfbd"/><text x="474.0" y="147.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#b18d54" text-anchor="middle">Cost to attack</text><text x="474.0" y="165.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="middle">Rewriting history</text><text x="474.0" y="183.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="middle">means paying again</text><line x1="554" y1="160" x2="576" y2="160" stroke="#43536b" stroke-width="1.6"/><polygon points="576,160 568,156 568,164" fill="#43536b"/><rect x="576" y="110" width="160" height="100" rx="4" fill="#efe8d8" stroke="#d7cfbd"/><text x="656.0" y="147.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#b18d54" text-anchor="middle">Honest ledger</text><text x="656.0" y="165.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="middle">Anyone can verify</text><text x="656.0" y="183.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="middle">without trust</text><rect x="30" y="236" width="700" height="50" rx="4" fill="#fff" stroke="#b18d54"/><text x="380.0" y="266.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#172b4d" text-anchor="middle">The fair debate: how much energy, from which sources, and whether the security is worth it</text><text x="30" y="322" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#43536b" text-anchor="start">Use measured data, such as the Cambridge index linked in the text, not slogans.</text></svg>