<nav aria-label="Mobile navigation" id="main-menu-mobile" class="main-menu-mobile">
  {% assign mainmenu = site.data.menus.main | sort: 'weight'  %}
  <ul>
    {% for item in mainmenu %}
    {% if item.children %}
    <li class="has-sub"><span class="sub-label">{{ item.name }}</span>
      <ul class="sub-list">
        {% for child in item.children %}
        <li class="{% if page.url contains child.url %}active{% endif %}"><a href="{{ child.url | relative_url }}" {% if page.url contains child.url %}aria-current="page"{% endif %}>{{ child.name }}</a></li>
        {% endfor %}
      </ul>
    </li>
    {% else %}
    <li class="{% if page.url contains item.url %}active{% endif %}">
      <a href="{{ item.url | relative_url }}" {% if page.url contains item.url %}aria-current="page"{% endif %}>{{ item.name }}</a>
    </li>
    {% endif %}
    {% endfor %}
  </ul>
</nav>
