<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-labelledby="t d"><title id="t">Two of three signing quorum</title><desc id="d">Three keys held by different people in different places; any two can approve a transaction from the company wallet.</desc><rect width="760" height="340" fill="#fcf9f0"/><text x="30" y="38" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#172b4d" text-anchor="start">A 2-of-3 signing quorum</text><text x="30" y="58" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#43536b" text-anchor="start">Any two keys approve. Losing one key does not lose the treasury.</text><line x1="30" y1="70" x2="730" y2="70" stroke="#b18d54" stroke-width="2"/><rect x="60" y="96" width="170" height="86" rx="4" fill="#efe8d8" stroke="#d7cfbd"/><text x="145.0" y="126.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#b18d54" text-anchor="middle">Key A</text><text x="145.0" y="144.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="middle">Finance director</text><text x="145.0" y="162.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="middle">Office safe</text><line x1="145" y1="182" x2="380" y2="226" stroke="#43536b" stroke-width="1.6"/><polygon points="380,226 376,218 384,218" fill="#43536b"/><rect x="280" y="96" width="170" height="86" rx="4" fill="#efe8d8" stroke="#d7cfbd"/><text x="365.0" y="126.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#b18d54" text-anchor="middle">Key B</text><text x="365.0" y="144.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="middle">Chief executive</text><text x="365.0" y="162.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="middle">Bank vault</text><line x1="365" y1="182" x2="380" y2="226" stroke="#43536b" stroke-width="1.6"/><polygon points="380,226 376,218 384,218" fill="#43536b"/><rect x="500" y="96" width="170" height="86" rx="4" fill="#efe8d8" stroke="#d7cfbd"/><text x="585.0" y="126.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#b18d54" text-anchor="middle">Key C</text><text x="585.0" y="144.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="middle">Independent holder</text><text x="585.0" y="162.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="middle">Other city</text><line x1="585" y1="182" x2="380" y2="226" stroke="#43536b" stroke-width="1.6"/><polygon points="380,226 376,218 384,218" fill="#43536b"/><rect x="250" y="228" width="260" height="56" rx="4" fill="#172b4d" stroke="#d7cfbd"/><text x="380.0" y="252.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f8f4e8" text-anchor="middle">Company wallet</text><text x="380.0" y="270.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f8f4e8" text-anchor="middle">moves when any 2 sign</text><text x="30" y="322" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#43536b" text-anchor="start">Example layout. Roles, thresholds and places are decided in your policy and tested in a recovery drill.</text></svg>