<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-labelledby="t d"><title id="t">Custody models compared</title><desc id="d">Single key, multisig self-custody and regulated custodian, arranged from more control to more reliance on others.</desc><rect width="760" height="340" fill="#fcf9f0"/><text x="30" y="38" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#172b4d" text-anchor="start">Three custody models, one trade-off</text><text x="30" y="58" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#43536b" text-anchor="start">Control against operational burden</text><line x1="30" y1="70" x2="730" y2="70" stroke="#b18d54" stroke-width="2"/><rect x="30" y="96" width="220" height="110" rx="4" fill="#efe8d8" stroke="#d7cfbd"/><text x="140.0" y="138.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#b18d54" text-anchor="middle">Single key</text><text x="140.0" y="156.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="middle">Simple, one point</text><text x="140.0" y="174.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="middle">of failure</text><text x="140" y="228" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#43536b" text-anchor="middle">Not for companies</text><rect x="270" y="96" width="220" height="110" rx="4" fill="#fff" stroke="#b18d54"/><text x="380.0" y="138.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#b18d54" text-anchor="middle">Multisig self-custody</text><text x="380.0" y="156.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="middle">No single point of failure.</text><text x="380.0" y="174.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="middle">Needs procedures and drills</text><text x="380" y="228" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#43536b" text-anchor="middle">You run it</text><rect x="510" y="96" width="220" height="110" rx="4" fill="#efe8d8" stroke="#d7cfbd"/><text x="620.0" y="138.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#b18d54" text-anchor="middle">Regulated custodian</text><text x="620.0" y="156.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="middle">Professional controls.</text><text x="620.0" y="174.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#172b4d" text-anchor="middle">You rely on the provider</text><text x="620" y="228" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#43536b" text-anchor="middle">They run it</text><line x1="30" y1="262" x2="730" y2="262" stroke="#d7cfbd"/><text x="30" y="284" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" fill="#43536b">More control, more work for you</text><text x="730" y="284" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" fill="#43536b" text-anchor="end">Less work for you, more reliance on others</text></svg>