<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-labelledby="t d"><title id="t">Purchasing power of idle cash at 3% inflation</title><desc id="d">Bar chart showing 100 units of cash falling to 86.3 units of purchasing power after five years at an assumed 3 percent inflation.</desc><rect width="760" height="340" fill="#fcf9f0"/><text x="30" y="38" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#172b4d" text-anchor="start">What 100 of idle cash buys over time</text><text x="30" y="58" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#43536b" text-anchor="start">Illustration at an assumed 3% a year. A worked example, not a forecast.</text><line x1="30" y1="70" x2="730" y2="70" stroke="#b18d54" stroke-width="2"/><rect x="60" y="130.0" width="70" height="170.0" rx="3" fill="#172b4d" opacity="1"/><text x="95" y="122.0" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#172b4d" text-anchor="middle">100.0</text><text x="95" y="318" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#43536b" text-anchor="middle">Today</text><rect x="172" y="134.93" width="70" height="165.07" rx="3" fill="#b18d54" opacity="0.75"/><text x="207" y="126.93" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#172b4d" text-anchor="middle">97.1</text><text x="207" y="318" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#43536b" text-anchor="middle">Year 1</text><rect x="284" y="139.69" width="70" height="160.31" rx="3" fill="#b18d54" opacity="0.75"/><text x="319" y="131.69" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#172b4d" text-anchor="middle">94.3</text><text x="319" y="318" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#43536b" text-anchor="middle">Year 2</text><rect x="396" y="144.45000000000002" width="70" height="155.54999999999998" rx="3" fill="#b18d54" opacity="0.75"/><text x="431" y="136.45000000000002" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#172b4d" text-anchor="middle">91.5</text><text x="431" y="318" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#43536b" text-anchor="middle">Year 3</text><rect x="508" y="149.04000000000002" width="70" height="150.95999999999998" rx="3" fill="#b18d54" opacity="0.75"/><text x="543" y="141.04000000000002" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#172b4d" text-anchor="middle">88.8</text><text x="543" y="318" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#43536b" text-anchor="middle">Year 4</text><rect x="620" y="153.29000000000002" width="70" height="146.70999999999998" rx="3" fill="#b18d54" opacity="1"/><text x="655" y="145.29000000000002" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#172b4d" text-anchor="middle">86.3</text><text x="655" y="318" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#43536b" text-anchor="middle">Year 5</text><text x="730" y="100" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#43536b" text-anchor="end">The balance does not change. What it buys does.</text></svg>