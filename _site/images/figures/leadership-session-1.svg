<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="t d"><title id="t">Ninety minute session agenda</title><desc id="d">A 90 minute agenda: context 10, the problem 20, options 25, risks 20, and next steps with owners 15 minutes.</desc><rect width="760" height="300" fill="#fcf9f0"/><text x="30" y="38" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#172b4d" text-anchor="start">A 90-minute leadership session</text><text x="30" y="58" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#43536b" text-anchor="start">Minutes per block. The last block is the one that matters.</text><line x1="30" y1="70" x2="730" y2="70" stroke="#b18d54" stroke-width="2"/><rect x="30" y="120" width="73.77777777777777" height="110" rx="4" fill="#efe8d8" stroke="#d7cfbd"/><text x="66.88888888888889" y="172" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#172b4d" text-anchor="middle">Context</text><text x="66.88888888888889" y="194" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#43536b" text-anchor="middle">10 min</text><rect x="107.77777777777777" y="120" width="151.55555555555554" height="110" rx="4" fill="#fff" stroke="#d7cfbd"/><text x="183.55555555555554" y="172" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#172b4d" text-anchor="middle">The problem</text><text x="183.55555555555554" y="194" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#43536b" text-anchor="middle">20 min</text><rect x="263.3333333333333" y="120" width="190.44444444444446" height="110" rx="4" fill="#efe8d8" stroke="#d7cfbd"/><text x="358.55555555555554" y="172" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#172b4d" text-anchor="middle">Options</text><text x="358.55555555555554" y="194" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#43536b" text-anchor="middle">25 min</text><rect x="457.77777777777777" y="120" width="151.55555555555554" height="110" rx="4" fill="#fff" stroke="#d7cfbd"/><text x="533.5555555555555" y="172" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#172b4d" text-anchor="middle">Risks</text><text x="533.5555555555555" y="194" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#43536b" text-anchor="middle">20 min</text><rect x="613.3333333333333" y="120" width="112.66666666666666" height="110" rx="4" fill="#172b4d" stroke="#d7cfbd"/><text x="669.6666666666666" y="172" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#f8f4e8" text-anchor="middle">Next steps and owners</text><text x="669.6666666666666" y="194" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e5cf9f" text-anchor="middle">15 min</text><text x="30" y="286" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#43536b" text-anchor="start">Leave with named owners and dates, or the session was a lecture.</text></svg>