<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-labelledby="t d"><title id="t">Gold versus Bitcoin properties</title><desc id="d">A five-row comparison of supply, moving, verifying, holding and track record for gold and Bitcoin.</desc><rect width="760" height="340" fill="#fcf9f0"/><text x="30" y="38" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#172b4d" text-anchor="start">Gold and Bitcoin, property by property</text><text x="30" y="58" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#43536b" text-anchor="start">Described, not scored. Your policy decides which properties matter.</text><line x1="30" y1="70" x2="730" y2="70" stroke="#b18d54" stroke-width="2"/><text x="220" y="92" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#b18d54" text-anchor="middle">Gold</text><text x="500" y="92" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#b18d54" text-anchor="middle">Bitcoin</text><rect x="30" y="102" width="700" height="38" fill="#efe8d8"/><text x="42" y="126" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#172b4d" text-anchor="start">Supply</text><text x="220" y="126" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#43536b" text-anchor="middle">New gold is mined each year</text><text x="500" y="126" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#43536b" text-anchor="middle">Capped by protocol rules</text><rect x="30" y="144" width="700" height="38" fill="#fcf9f0"/><text x="42" y="168" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#172b4d" text-anchor="start">Moving it</text><text x="220" y="168" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#43536b" text-anchor="middle">Heavy; needs transport and insurance</text><text x="500" y="168" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#43536b" text-anchor="middle">Electronic; moves in minutes</text><rect x="30" y="186" width="700" height="38" fill="#efe8d8"/><text x="42" y="210" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#172b4d" text-anchor="start">Verifying it</text><text x="220" y="210" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#43536b" text-anchor="middle">Assay and trusted vault records</text><text x="500" y="210" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#43536b" text-anchor="middle">Anyone can check the ledger</text><rect x="30" y="228" width="700" height="38" fill="#fcf9f0"/><text x="42" y="252" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#172b4d" text-anchor="start">Holding it</text><text x="220" y="252" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#43536b" text-anchor="middle">Vault or custodian</text><text x="500" y="252" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#43536b" text-anchor="middle">Keys, or a custodian</text><rect x="30" y="270" width="700" height="38" fill="#efe8d8"/><text x="42" y="294" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#172b4d" text-anchor="start">Track record</text><text x="220" y="294" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#43536b" text-anchor="middle">Thousands of years</text><text x="500" y="294" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#43536b" text-anchor="middle">Since 2009</text><text x="30" y="324" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#43536b" text-anchor="start">Sources for the supply points are linked in the text.</text></svg>